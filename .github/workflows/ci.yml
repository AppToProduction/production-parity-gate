name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Exercise the packaged action
        uses: ./
        with:
          contract: fixtures/contracts/clean.contract.yml
          output: runs/action-clean
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-evidence
          path: runs/*/
          if-no-files-found: error
          retention-days: 7
