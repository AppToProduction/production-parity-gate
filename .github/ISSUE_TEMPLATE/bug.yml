name: Bug report
description: Report a reproducible defect without including credentials or production data.
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste secrets, environment values, customer data, or private deployment URLs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Use variable names and synthetic values only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
